<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A premium and dynamic Todo application built with Vanilla JS, HTML, and CSS.">
    <title>Tasks - Dynamic Todo App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My Tasks</h1>
            <p class="subtitle" id="task-stats">0 tasks remaining</p>
        </header>

        <form id="todo-form" class="input-group">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" />
            <button type="submit" id="add-btn" class="btn-primary">
                <i class="fas fa-plus"></i>
            </button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" class="todo-list">
            <!-- Todos will be appended here -->
        </ul>
        
        <div class="clear-container">
            <button id="clear-completed" class="btn-text" style="display: none;">Clear completed</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
